pipelines:
  branches:
    main:
      - step:
          name: Check, test and build
          image: node:24
          caches:
            - node
          script:
            - export HUSKY=0
            - npm ci
            # Runs the static checks, the tests, both bundles, then the
            # artifact guard: the npm tarball must be stdio-only, and every
            # bare import in its bundle must be a declared dependency.
            - npm run verify
      - step:
          name: Build the hosted image
          services:
            - docker
          script:
            # The image is the only way the HTTP server ships, so a broken
            # Dockerfile has to fail here rather than at deploy time.
            - docker build -t dynomapper-mcp:$BITBUCKET_COMMIT .
      - step:
          name: Scan
          image: shiftleft/sast-scan:latest
          script:
            - scan --no-error
            - zip -r all-reports.zip reports/
          artifacts:
            - all-reports.zip
      - step:
          name: Export scan reports
          clone:
            enabled: false
          script:
            - pipe: atlassian/bitbucket-upload-file:0.7.5
              variables:
                ATLASSIAN_ACCOUNT_EMAIL: $ATLASSIAN_ACCOUNT_EMAIL
                ATLASSIAN_API_TOKEN: $ATLASSIAN_API_TOKEN
                FILENAME: 'all-reports.zip'
